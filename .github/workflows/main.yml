name: Cypress Tests (Lightweight)

on:
  push:
    branches:
      - develop
      - testes-automatizados-extras
      - main
  pull_request:
    branches:
      - develop
      - testes-automatizados-extras
      - main
  workflow_dispatch:

jobs:
  cypress-run:
    name: Cypress E2E & API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Prepare mock exports and build
        run: |
          yarn predev:cognito:ci
          yarn build

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          start: yarn start:ci
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: chrome
          spec: |
            cypress/tests/api/api-users.spec.ts
            cypress/tests/ui/auth.spec.ts

      - name: Upload screenshots if tests fail
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
